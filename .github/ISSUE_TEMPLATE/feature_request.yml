name: Feature request
description: Предложить новую возможность или улучшение
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Опишите пользовательскую задачу, а не только желаемую реализацию. Изменения загрузчика, MTD, UBI и внутренней разметки рассматриваются только для точной модели и аппаратной ревизии.

  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какой сценарий сейчас неудобен, небезопасен или не поддерживается.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как должна выглядеть новая возможность для пользователя.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
      description: Какие существующие способы уже проверены и почему они недостаточны.

  - type: input
    id: router
    attributes:
      label: Роутер и аппаратная ревизия
      description: Обязательно для device-specific функции.
      placeholder: GL.iNet Flint 2 GL-MT6000, rev A

  - type: input
    id: openwrt
    attributes:
      label: Версия и target OpenWrt
      placeholder: OpenWrt 25.12.5, mediatek/filogic

  - type: textarea
    id: risks
    attributes:
      label: Риски и откат
      description: Возможная потеря сети, SSH, данных, загрузки и предлагаемый способ восстановления.

  - type: checkboxes
    id: checklist
    attributes:
      label: Проверка предложения
      options:
        - label: Возможность не требует Python, Docker или другого runtime на роутере.
          required: true
        - label: Я указал аппаратную ревизию, если изменение зависит от устройства.
          required: false
        - label: Я не включил в описание секреты или персональные данные.
          required: true
