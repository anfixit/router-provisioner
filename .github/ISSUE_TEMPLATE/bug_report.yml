name: Bug report
description: Сообщить о воспроизводимой ошибке Router Provisioner
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не публикуйте ссылки подписок, UUID, токены, приватные ключи, пароли, `/etc/shadow` и полные backup-архивы.

  - type: input
    id: version
    attributes:
      label: Версия Router Provisioner
      description: Результат команды `/tmp/router-provisioner.sh --version`.
      placeholder: 1.0.1
    validations:
      required: true

  - type: input
    id: router
    attributes:
      label: Роутер и аппаратная ревизия
      placeholder: GL.iNet Flint 2 GL-MT6000, rev A
    validations:
      required: true

  - type: input
    id: openwrt
    attributes:
      label: Версия и target OpenWrt
      description: Возьмите из вывода `--diagnose`.
      placeholder: OpenWrt 25.12.5, mediatek/filogic
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Режим запуска
      options:
        - --diagnose
        - --dry-run
        - обычный интерактивный запуск
        - тесты разработки
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло вместо ожидаемого результата.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Минимальная последовательность действий без секретов.
      placeholder: |
        1. Запустить ...
        2. Выбрать ...
        3. Получить ошибку ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика и логи
      description: Удалите ссылки подписок, UUID, IP, ключи, токены и пароли.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Дополнительный контекст
      description: Схема подключения, внешний накопитель, extroot, нестандартная прошивка или другие важные условия.

  - type: checkboxes
    id: checklist
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Я проверил последнюю версию из ветки main.
          required: true
        - label: Я удалил из отчёта все секреты и персональные данные.
          required: true
        - label: Я не публикую уязвимость, требующую приватного раскрытия.
          required: true
