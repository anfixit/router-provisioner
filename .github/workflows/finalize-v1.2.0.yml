name: Finalize v1.2.0

on:
  push:
    branches:
      - fix/netshift-readiness-v1.2.0
    paths:
      - .github/finalize_v12.py
      - .github/workflows/finalize-v1.2.0.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          ref: fix/netshift-readiness-v1.2.0

      - name: Apply final hardening
        run: python3 .github/finalize_v12.py

      - name: Install shell tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq busybox shellcheck >/dev/null

      - name: Check POSIX syntax
        run: sh -n router-provisioner.sh && dash -n router-provisioner.sh && busybox ash -n router-provisioner.sh

      - name: Run tests
        run: dash tests/test_router_provisioner.sh && busybox ash tests/test_router_provisioner.sh

      - name: Run ShellCheck
        run: shellcheck -x router-provisioner.sh tests/*.sh

      - name: Commit verified files
        run: |
          rm -f .github/finalize_v12.py
          rm -f .github/workflows/finalize-v1.2.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden NetShift readiness and rollback"
          git push origin HEAD:fix/netshift-readiness-v1.2.0
