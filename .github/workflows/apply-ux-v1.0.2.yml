name: Apply UX v1.0.2 patch

on:
  push:
    branches:
      - main
    paths:
      - .github/ux-v1.0.2.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shell tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq busybox shellcheck >/dev/null

      - name: Apply patch
        run: git apply --check .github/ux-v1.0.2.patch && git apply .github/ux-v1.0.2.patch

      - name: Check POSIX syntax
        run: sh -n router-provisioner.sh && dash -n router-provisioner.sh && busybox ash -n router-provisioner.sh

      - name: Run tests
        run: dash tests/test_router_provisioner.sh && busybox ash tests/test_router_provisioner.sh

      - name: Run ShellCheck
        run: shellcheck router-provisioner.sh tests/*.sh

      - name: Commit verified changes
        run: |
          rm -f .github/ux-v1.0.2.patch .github/workflows/apply-ux-v1.0.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve interactive SSH and Wi-Fi prompts"
          git push origin main
