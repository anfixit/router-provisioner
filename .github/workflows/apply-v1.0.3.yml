name: Apply v1.0.3 patch

on:
  push:
    branches:
      - main
    paths:
      - .github/apply-v1.0.3.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shell tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq busybox shellcheck >/dev/null

      - name: Apply changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          script_path = Path("router-provisioner.sh")
          script = script_path.read_text()
          script = replace_once(
              script,
              "PROGRAM_VERSION='1.0.2'",
              "PROGRAM_VERSION='1.0.3'",
              "program version",
          )
          script = replace_once(
              script,
              "encode_target() {\n    printf '%s' \"$1\" | sed 's,/,%2F,g'\n}\n",
              "encode_target() {\n    printf '%s' \"$1\" | sed 's,/,%2F,g'\n}\n\nstrip_cidr_suffix() {\n    printf '%s\\n' \"${1%%/*}\"\n}\n",
              "CIDR helper",
          )
          script = replace_once(
              script,
              "        router_address=${router_address:-router}\n        ssh_port=$(uci -q get dropbear.@dropbear[0].Port \\\n",
              "        router_address=${router_address:-router}\n        router_address=$(strip_cidr_suffix \"$router_address\")\n        ssh_port=$(uci -q get dropbear.@dropbear[0].Port \\\n",
              "backup address normalization",
          )
          script = replace_once(
              script,
              "    if [ \"$DRY_RUN\" -eq 1 ]; then\n        info \"DRY-RUN: sh $installer\"\n        return 0\n    fi\n",
              "    if [ \"$DRY_RUN\" -eq 1 ]; then\n        info 'DRY-RUN: установщик NetShift не запускался.'\n        info \"План команды: sh $installer\"\n        return 0\n    fi\n",
              "NetShift dry-run message",
          )
          script = replace_once(
              script,
              "    lan_ip=$(uci -q get network.lan.ipaddr 2>/dev/null || true)\n    lan_ip=${lan_ip:-192.168.1.1}\n    ssh_port=$(uci -q get dropbear.@dropbear[0].Port \\\n",
              "    lan_ip=$(uci -q get network.lan.ipaddr 2>/dev/null || true)\n    lan_ip=${lan_ip:-192.168.1.1}\n    lan_ip=$(strip_cidr_suffix \"$lan_ip\")\n    ssh_port=$(uci -q get dropbear.@dropbear[0].Port \\\n",
              "final address normalization",
          )
          script = replace_once(
              script,
              "    print_line\n    print_line '=== Готово ==='\n",
              "    if [ \"$DRY_RUN\" -eq 1 ]; then\n        print_line\n        print_line '=== DRY-RUN завершён ==='\n        print_line 'Изменения не применялись.'\n        print_line 'NetShift не устанавливался, конфигурация не сохранялась.'\n        print_line 'Службы и Dropbear не перезапускались.'\n        print_line 'Для реальной настройки запустите скрипт без --dry-run.'\n        return 0\n    fi\n\n    print_line\n    print_line '=== Готово ==='\n",
              "dry-run final summary",
          )
          script_path.write_text(script)

          version_path = Path("VERSION")
          version_path.write_text("1.0.3\n")

          tests_path = Path("tests/test_router_provisioner.sh")
          tests = tests_path.read_text()
          insertion = r'''

test_strip_cidr_suffix() {
    result=$(strip_cidr_suffix '192.168.1.1/24')
    assert_equal '192.168.1.1' "$result" \
        'CIDR suffix must be removed from router addresses'

    result=$(strip_cidr_suffix '192.168.1.1')
    assert_equal '192.168.1.1' "$result" \
        'plain router address must remain unchanged'
}

test_dry_run_final_summary() {
    DRY_RUN=1
    BACKUP_FILE='/tmp/should-not-be-shown.tar.gz'

    uci() {
        case "${3:-}" in
            system.@system[0].hostname)
                printf '%s\n' 'OpenWrt'
                ;;
            network.lan.ipaddr)
                printf '%s\n' '192.168.1.1/24'
                ;;
            dropbear.@dropbear[0].Port)
                printf '%s\n' '22'
                ;;
        esac
    }

    output=$(print_final_instructions 2>&1)

    assert_contains "$output" '=== DRY-RUN завершён ===' \
        'dry-run summary heading is missing'
    assert_contains "$output" 'NetShift не устанавливался' \
        'dry-run must state that NetShift was not installed'
    assert_not_contains "$output" '=== Готово ===' \
        'dry-run must not claim provisioning completed'
    assert_not_contains "$output" '/24' \
        'CIDR suffix must not appear in final addresses'
    assert_not_contains "$output" 'dropbear restart' \
        'dry-run must not request Dropbear restart'
    assert_not_contains "$output" "$BACKUP_FILE" \
        'dry-run must not show a nonexistent backup'

    unset -f uci 2>/dev/null || true
    DRY_RUN=0
    BACKUP_FILE=''
}

test_netshift_dry_run_message() {
    script=$(cat "$PROJECT_DIR/router-provisioner.sh")

    assert_contains "$script" \
        'DRY-RUN: установщик NetShift не запускался.' \
        'NetShift dry-run message must be explicit'
    assert_not_contains "$script" \
        'info "DRY-RUN: sh $installer"' \
        'ambiguous NetShift dry-run message is still present'
}
'''
          tests = replace_once(
              tests,
              "\n# White-box test variables are consumed by the sourced runtime.\n# shellcheck disable=SC2034\ntest_firmware_plan() {\n",
              insertion + "\n# White-box test variables are consumed by the sourced runtime.\n# shellcheck disable=SC2034\ntest_firmware_plan() {\n",
              "new tests insertion",
          )
          tests = replace_once(
              tests,
              "    test_dry_run_tracks_root_password\n    test_firmware_plan\n",
              "    test_dry_run_tracks_root_password\n    test_strip_cidr_suffix\n    test_dry_run_final_summary\n    test_netshift_dry_run_message\n    test_firmware_plan\n",
              "new tests registration",
          )
          tests_path.write_text(tests)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          section = """## [1.0.3] - 2026-07-19\n\n### Fixed\n\n- Dry-run явно сообщает, что NetShift и службы не запускались.\n- Dry-run больше не показывает ложный финал, несуществующий backup и перезапуск Dropbear.\n- CIDR-префикс удаляется из адресов LuCI, SSH и команды копирования backup.\n\n"""
          changelog = replace_once(
              changelog,
              "## [1.0.1] - 2026-07-19\n",
              section + "## [1.0.1] - 2026-07-19\n",
              "changelog section",
          )
          changelog_path.write_text(changelog)

      - name: Check POSIX syntax
        run: sh -n router-provisioner.sh && dash -n router-provisioner.sh && busybox ash -n router-provisioner.sh

      - name: Run tests
        run: dash tests/test_router_provisioner.sh && busybox ash tests/test_router_provisioner.sh

      - name: Run ShellCheck
        run: shellcheck -x router-provisioner.sh tests/*.sh

      - name: Commit verified changes
        run: |
          rm -f .github/apply-v1.0.3.trigger .github/workflows/apply-v1.0.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clarify dry-run and normalize router addresses"
          git push origin main
