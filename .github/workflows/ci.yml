name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq busybox shellcheck >/dev/null

      - name: ShellCheck
        run: |
          shellcheck -x -e SC1090,SC2034,SC2317 \
            router-provisioner.sh lib/*.sh tests/*.sh

      - name: POSIX syntax
        run: |
          sh -n router-provisioner.sh lib/*.sh
          dash -n router-provisioner.sh lib/*.sh
          busybox ash -n router-provisioner.sh lib/*.sh

      - name: Tests with dash
        run: dash tests/test_router_provisioner.sh

      - name: Tests with BusyBox ash
        run: busybox ash tests/test_router_provisioner.sh

      - name: Secret regression scan
        run: |
          ! grep -RInE \
            '(api/sub/[A-Za-z0-9_-]{8,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)' \
            --exclude-dir=.git \
            --exclude='test_*.sh' \
            .
