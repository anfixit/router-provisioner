name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shell tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq busybox shellcheck >/dev/null

      - name: ShellCheck
        run: |
          shellcheck -x -e SC1090,SC2034,SC2317 \
            router-provisioner.sh lib/*.sh runtime/* tests/*.sh

      - name: POSIX syntax
        run: |
          sh -n router-provisioner.sh lib/*.sh runtime/*
          dash -n router-provisioner.sh lib/*.sh runtime/*
          busybox ash -n router-provisioner.sh lib/*.sh runtime/*

      - name: Tests with dash
        id: dash_tests
        continue-on-error: true
        run: dash -x tests/test_router_provisioner.sh > test-dash.log 2>&1

      - name: Tests with BusyBox ash
        id: ash_tests
        continue-on-error: true
        run: busybox ash -x tests/test_router_provisioner.sh > test-ash.log 2>&1

      - name: Upload shell test reports
        if: steps.dash_tests.outcome == 'failure' || steps.ash_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: shell-test-reports
          path: test-*.log
          retention-days: 7

      - name: Fail on shell test errors
        if: steps.dash_tests.outcome == 'failure' || steps.ash_tests.outcome == 'failure'
        run: |
          cat test-dash.log
          cat test-ash.log
          exit 1

      - name: Secret regression scan
        run: |
          ! grep -RInE \
            '(api/sub/[A-Za-z0-9_-]{8,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)' \
            --exclude-dir=.git \
            --exclude='test_*.sh' \
            .
